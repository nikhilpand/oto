name: Build & Release Android App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release'
        required: true
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (e.g. v0.1.0)'
        required: false
        type: string
        default: 'v0.1.2'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Universal Release APK
            task: assembleRelease
            extra_args: ''
            output_pattern: 'app/build/outputs/apk/release/*.apk'
            artifact_name: OTO-Music-universal.apk
          - name: ARM64-v8a Release APK
            task: assembleRelease
            extra_args: '-PreactNativeArchitectures=arm64-v8a'
            output_pattern: 'app/build/outputs/apk/release/*.apk'
            artifact_name: OTO-Music-arm64-v8a.apk
          - name: Debug APK
            task: assembleDebug
            extra_args: ''
            output_pattern: 'app/build/outputs/apk/debug/*.apk'
            artifact_name: OTO-Music-debug.apk
          - name: Android App Bundle (AAB)
            task: bundleRelease
            extra_args: ''
            output_pattern: 'app/build/outputs/bundle/release/*.aab'
            artifact_name: OTO-Music.aab

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Accept Android SDK Licenses
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | sdkmanager --licenses || true

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Native Android Project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Android Target
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew ${{ matrix.task }} ${{ matrix.extra_args }}

      - name: Package Artifact
        run: |
          mkdir -p artifacts
          SOURCE_FILE=$(find android/${{ matrix.output_pattern }} -name "*.apk" -o -name "*.aab" | head -n 1)
          if [ -z "$SOURCE_FILE" ]; then
            echo "Error: Output file not found for ${{ matrix.name }}!"
            exit 1
          fi
          echo "Found: $SOURCE_FILE"
          cp "$SOURCE_FILE" artifacts/${{ matrix.artifact_name }}
          echo "Packaged as artifacts/${{ matrix.artifact_name }}"

      - name: Upload Variant Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/${{ matrix.artifact_name }}
          retention-days: 14

  release:
    name: Package & Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd all-artifacts
          sha256sum * > SHA256SUMS.txt
          echo "=== Release Artifacts & Checksums ==="
          cat SHA256SUMS.txt
          ls -lh

      - name: Upload Consolidated Bundle
        uses: actions/upload-artifact@v4
        with:
          name: OTO-Music-All-Builds
          path: all-artifacts/*
          retention-days: 14

      - name: Determine Release Information
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
            SHOULD_RELEASE="${{ inputs.publish_release }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            SHOULD_RELEASE="true"
          else
            TAG="v0.1.2"
            SHOULD_RELEASE="true"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "should_release=$SHOULD_RELEASE" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.release_info.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "OTO Music ${{ steps.release_info.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: all-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
