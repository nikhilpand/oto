name: Build & Release Android App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build Target'
        required: true
        type: choice
        options:
          - all
          - universal
          - arm64
          - aab
          - debug
        default: all
      publish_release:
        description: 'Publish as GitHub Release'
        required: true
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (e.g. v0.1.0)'
        required: false
        type: string
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android (${{ inputs.build_target || 'all' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Accept Android SDK Licenses
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | sdkmanager --licenses || true

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript & Test Verification
        run: |
          npx tsc --noEmit
          npm run lint
          npm test -- --watchAll=false
          npx expo-doctor

      - name: Prebuild Native Android Project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Android Targets
        run: |
          mkdir -p build-artifacts
          TARGET="${{ inputs.build_target || 'all' }}"
          echo "Selected build target: $TARGET"

          cd android
          chmod +x gradlew

          # 1. Universal Release APK (All ABIs)
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "universal" ]; then
            echo "==> Building Universal Release APK..."
            ./gradlew assembleRelease --no-daemon
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            if [ -n "$APK_PATH" ]; then
              cp "$APK_PATH" ../build-artifacts/OTO-Music-universal.apk
              echo "Universal APK created."
            fi
          fi

          # 2. ARM64-v8a Release APK (Modern Android 64-bit)
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "arm64" ]; then
            echo "==> Building ARM64-v8a Release APK..."
            ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            if [ -n "$APK_PATH" ]; then
              cp "$APK_PATH" ../build-artifacts/OTO-Music-arm64-v8a.apk
              echo "ARM64 APK created."
            fi
          fi

          # 3. ARMv7 Release APK (Legacy 32-bit devices)
          if [ "$TARGET" = "all" ]; then
            echo "==> Building ARMv7 Release APK..."
            ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a --no-daemon
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            if [ -n "$APK_PATH" ]; then
              cp "$APK_PATH" ../build-artifacts/OTO-Music-armeabi-v7a.apk
              echo "ARMv7 APK created."
            fi
          fi

          # 4. Debug APK (For testing & development)
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "debug" ]; then
            echo "==> Building Debug APK..."
            ./gradlew assembleDebug --no-daemon
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
            if [ -n "$APK_PATH" ]; then
              cp "$APK_PATH" ../build-artifacts/OTO-Music-debug.apk
              echo "Debug APK created."
            fi
          fi

          # 5. Android App Bundle (Google Play Store format)
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "aab" ]; then
            echo "==> Building Android App Bundle (AAB)..."
            ./gradlew bundleRelease --no-daemon
            AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
            if [ -n "$AAB_PATH" ]; then
              cp "$AAB_PATH" ../build-artifacts/OTO-Music.aab
              echo "AAB created."
            fi
          fi

          cd ..
          cd build-artifacts
          echo "==> Generating SHA256 Checksums..."
          sha256sum * > SHA256SUMS.txt
          echo "==> Build Artifacts Summary:"
          ls -lh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OTO-Music-Builds
          path: build-artifacts/*
          retention-days: 14

      - name: Determine Release Information
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
            SHOULD_RELEASE="${{ inputs.publish_release }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            SHOULD_RELEASE="true"
          else
            TAG="v0.1.0-main"
            SHOULD_RELEASE="false"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "should_release=$SHOULD_RELEASE" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.release_info.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "OTO Music ${{ steps.release_info.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: build-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
